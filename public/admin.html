<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кабинет Sneckin</title>
    <link rel="stylesheet" href="/public/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Sneckin">
        <span class="brand-mark">S</span>
        <span>Sneckin</span>
      </a>
      <nav class="top-actions" aria-label="Главное меню">
        <a class="ghost-link" href="/">Магазин</a>
        <button id="logoutButton" class="icon-button hidden" type="button" title="Выйти" aria-label="Выйти">x</button>
      </nav>
    </header>

    <main class="page-shell admin-shell">
      <section class="admin-head">
        <div>
          <span class="eyebrow">владелец</span>
          <h1>Кабинет Sneckin</h1>
        </div>
        <div id="adminUser" class="admin-user"></div>
      </section>

      <section id="loginPanel" class="login-panel">
        <h2>Вход</h2>
        <div id="authBox" class="auth-box"></div>
      </section>

      <section id="adminPanel" class="admin-grid hidden">
        <form id="productForm" class="editor-panel">
          <input id="productId" type="hidden">
          <div class="section-head compact">
            <div>
              <span class="eyebrow">позиция</span>
              <h2 id="formTitle">Новая позиция</h2>
            </div>
            <button id="resetForm" class="icon-button" type="button" title="Очистить" aria-label="Очистить">+</button>
          </div>

          <label>
            <span>Название</span>
            <input id="name" required maxlength="80">
          </label>
          <label>
            <span>Цена</span>
            <input id="price" type="number" min="0.01" step="0.01" required>
          </label>
          <div class="form-row">
            <label>
              <span>Категория</span>
              <input id="category" value="Снеки" maxlength="60">
            </label>
            <label>
              <span>Вес</span>
              <input id="unit" value="100 г" maxlength="40">
            </label>
          </div>
          <input id="image" type="hidden" value="/assets/product-crunch-mix.png">
          <div class="image-editor">
            <img id="imagePreview" src="/assets/product-crunch-mix.png" alt="">
            <div>
              <label>
                <span>Готовая картинка</span>
                <select id="imagePreset">
                  <option value="/assets/product-crunch-mix.png">Crunch Mix</option>
                  <option value="/assets/product-cheese-crackers.png">Cheese Crackers</option>
                  <option value="/assets/product-fruit-chips.png">Fruit Chips</option>
                  <option value="/assets/product-nut-box.png">Nut Box</option>
                  <option value="">Свое фото</option>
                </select>
              </label>
              <label>
                <span>Загрузить фото</span>
                <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              </label>
            </div>
          </div>
          <label>
            <span>Описание</span>
            <textarea id="description" rows="4" maxlength="400"></textarea>
          </label>
          <label class="toggle-row">
            <input id="available" type="checkbox" checked>
            <span>Показывать на сайте</span>
          </label>
          <button class="primary-button" type="submit">Сохранить</button>
        </form>

        <section class="manager-panel">
          <div class="section-head compact">
            <div>
              <span class="eyebrow">каталог</span>
              <h2>Позиции</h2>
            </div>
            <span id="productCounter" class="count-pill">0</span>
          </div>
          <div id="adminProducts" class="admin-products"></div>
        </section>

        <section class="orders-panel">
          <div class="section-head compact">
            <div>
              <span class="eyebrow">заказы</span>
              <h2>Последние</h2>
            </div>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/admin.js?v=20260623" defer></script>
  </body>
</html>
